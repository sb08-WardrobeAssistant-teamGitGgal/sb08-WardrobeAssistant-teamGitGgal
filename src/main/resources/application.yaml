spring:
  cloud:
    aws:
      cloudwatch:
        enabled: false

  batch:
    job:
      enabled: false       # 앱 시작 시 배치 자동 실행 방지 (스케줄러로만 실행)
    jdbc:
      initialize-schema: never  # Flyway가 배치 스키마 관리 (V3__add_spring_batch_schema.sql)

  jpa:
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true
        use_sql_comments: true
        default_batch_fetch_size: 100
        jdbc:
          time_zone: UTC
    open-in-view: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 30MB

  flyway:
    enabled: true
    locations:
      - classpath:db/migration # 스키마 저장 위치 - 관례

  mail:
    host: smtp.naver.com
    port: 465
    username: ${NAVER_ID}
    password: ${NAVER_APP_PW}
    properties:
      mail:
        smtp:
          ssl:
            enable: true
            trust: smtp.naver.com
  ai:
    openai:
      base-url: https://api.openai.com
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-4o-mini

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_OAUTH_REST_API_KEY}
            client-secret: ${KAKAO_OAUTH_CLIENT_SECRET}
            redirect-uri: "{baseUrl}/login/oauth2/code/kakao"
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            client-name: Kakao
            scope:
              - profile_nickname
          google:
            client-id: ${GOOGLE_OAUTH_CLIENT_ID}
            client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET}
            redirect-uri: "{baseUrl}/login/oauth2/code/google"
            scope:
              - profile
              - email
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

  kafka:
    producer:
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      # 전송 실패 시 kafka 클라이언트가 자동으로 최대 3회 재시도
      retries: 3
      acks: all
      properties:
        # 재시도 사이 대기 시간
        retry.backoff.ms: 1000
        # 재시도 포함해서 전체 전송 허용하는 시간
        delivery.timeout.ms: 30000
    consumer:
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # 처음 구독하거나 오프셋이 없을 때 토픽의 맨 처음부터 메시지 읽음
      auto-offset-reset: earliest
      # 메시지 처리 완료 후 수동으로 커밋(실패 시 retry 토픽으로 이동)
      enable-auto-commit: false
      group-id: clothesplz-group

# Common Logging
logging:
  level:
    root: info
    org.apache.kafka: warn
    org.springframework.kafka: warn

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always
  health:
    circuitbreakers:
      enabled: true
  info:
    env:
      enabled: true
  cloudwatch:
    metrics:
      export:
        enabled: false
        namespace: clothesplz
        step: 1m

# s3
storage:
  s3:
    access-key: ${AWS_ACCESS_KEY}
    secret-key: ${AWS_SECRET_KEY}
    region: ${AWS_REGION}
    bucket: ${AWS_S3_BUCKET}
    cloudfront: ${AWS_CLOUDFRONT_DOMAIN}

# 초기 계정
clothesplz:
  admin:
    username: ${ADMIN_USERNAME}
    password: ${ADMIN_PASSWORD}
    email: ${ADMIN_EMAIL}
  jwt:
    access-token-secret: ${ACCESS_TOKEN_SECRET}
    access-token-exp: ${ACCESS_TOKEN_EXP}
    refresh-token-secret: ${REFRESH_TOKEN_SECRET}
    refresh-token-exp: ${REFRESH_TOKEN_EXP}
  oauth:
    redirect-uri: http://localhost:8080

weather:
  api:
    url: ${WEATHER_API_URL}
    service-key: ${WEATHER_API_SERVICE_KEY}

kakao:
  api:
    rest-key: ${KAKAO_REST_API_KEY}

openai:
  api:
    key: ${OPENAI_API_KEY}

resilience4j:
  circuitbreaker:
    instances:
      esSearch:
        # 최근 호출 10번을 기준으로 실패율을 계산
        sliding-window-type: count_based
        sliding-window-size: 10
        # 최근 호출 10번을 기준으로 50% 이상이면 Circuit Breaker가 open(차단) 상태로 전환
        failure-rate-threshold: 50
        # 10초 동안 fallback으로 요청 보냄, 10초 후에 half_open으로 전환
        wait-duration-in-open-state: 10s
        # half_open 상태에서 테스트로 실제 호출을 몇 번 허용할지
        permitted-number-of-calls-in-half-open-state: 3
        # 실패율 계산 시작하려면 최소 몇 번의 호출이 쌓여야 하는지
        # 5번이 쌓이기 전에는 실패해도 open으로 전환 x
        minimum-number-of-calls: 5
        # 10초가 지나면 다음 호출을 기다리지 않고 알아서 half_open으로 바꿈
        automatic-transition-from-open-to-half-open-enabled: true
        # Circuit Breaker가 카운트할 예외 목록
        record-exceptions:
          - java.net.ConnectException
          - java.io.IOException
        # Circuit Breaker가 카운트에서 제외할 예외 목록
        ignore-exceptions:
          - com.gitggal.clothesplz.exception.BusinessException
