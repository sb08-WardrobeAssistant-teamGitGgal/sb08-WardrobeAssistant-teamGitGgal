server:
  port: ${PORT}

spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_URL}:${POSTGRES_PORT}/${POSTGRES_DB}
    driver-class-name: org.postgresql.Driver
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      ssl:
        enabled: true

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    admin:
      auto-create: false # 토픽 자동 생성 차단

# Common Logging
logging:
  level:
    org.hibernate.SQL: warn
    org.hibernate.orm.jdbc.bind: warn

opensearch:
  uris: ${OPENSEARCH_HOST}
  username: ${OPENSEARCH_USERNAME}
  password: ${OPENSEARCH_PASSWORD}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true
      group:
        readiness:
          exclude: mail
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

clothesplz:
  admin:
    username: ${ADMIN_USERNAME}
    password: ${ADMIN_PASSWORD}
    email: ${ADMIN_EMAIL}
  jwt:
    access-token-secret: ${ACCESS_TOKEN_SECRET}
    access-token-exp: ${ACCESS_TOKEN_EXP}
    refresh-token-secret: ${REFRESH_TOKEN_SECRET}
    refresh-token-exp: ${REFRESH_TOKEN_EXP}
  oauth:
    redirect-uri: ${OAUTH_REDIRECT_URI}